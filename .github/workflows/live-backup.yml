name: Verify released clarification access
on:
  push:
    branches: [verify/backup-live-20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 841347f4c2a9666c5fcd3b08d6bfe80e13de1393
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify exact public assets and clarification access
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const base='https://sharonbasovich.github.io/cutoff/';
          const hashes={"LICENSE.txt":"cbde67c81f263d4f7513b588b2076a54064d8591970e11e31427cafb134130f7","THIRD_PARTY_NOTICES.txt":"be5d244efce7de0c6fb9fdefd306bb84e91f573bdccc6bf479e795a494982097","app.css":"0ae70c072407d7af1b2544b0a16fc6e1b718dc5b7469d6c50cfc1c25626786e8","app.css.map":"cc7e672796c07e2ccd6f948f75dd3228767821e9c281ecd10fdc8394369db3d5","app.js":"f1749d200f4ec79338251fb39c3fdcfb976fc9788530f88aad5e2cec07d7cda2","app.js.map":"d0b725a7761caaff510c326c2730c9138fce658f89aed2092aaa2002790accec","favicon.svg":"c0916576e317abfb728dc4eb6a12d74b96e7822995b09fe9b2c77d713bbdc05f","index.html":"b6fff09623b65fe07972d00baedceaedcaba45cef3fbd3d8c3723558de5ddce6"};
          for(const [path,hash] of Object.entries(hashes)){
            const r=await fetch(base+path);assert.equal(r.ok,true,path);
            assert.equal(createHash('sha256').update(Buffer.from(await r.arrayBuffer())).digest('hex'),hash,path);
          }
          const browser=await chromium.launch();
          try {
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(base);
            assert.equal(await page.locator('[data-resolve]').count(),2);
            assert.equal(await page.locator('#export-calendar').isDisabled(),true);
            const originals=await page.locator('.source-card blockquote').allTextContents();
            await page.locator('[data-resolve]').first().click();
            await page.locator('#resolution-zone').fill('UTC');
            await page.locator('#resolution-form button[type="submit"]').click();
            assert.match(await page.locator('#resolution-error').textContent(),/Add a note/);
            await page.locator('#resolution-note').fill('Synthetic public QA: explicitly check UTC interpretation.');
            await page.locator('#resolution-form button[type="submit"]').click();
            assert.deepEqual(await page.locator('.source-card blockquote').allTextContents(),originals);
            assert.equal(await page.locator('#export-calendar').isDisabled(),true);
            await page.reload();
            assert.equal(await page.locator('[data-resolve]').first().textContent().then(t=>t.includes('Review clarification')),true);
            await page.locator('[data-resolve]').first().click();
            await page.locator('#resolution-zone').fill('');
            await page.locator('#resolution-note').fill('');
            await page.locator('#resolution-form button[type="submit"]').click();
            assert.deepEqual(await page.locator('.source-card blockquote').allTextContents(),originals);
            assert.equal(await page.locator('#export-calendar').isDisabled(),true);
            const buffer=page.locator('#buffer-minutes');
            assert.equal(await buffer.getAttribute('type'),'text');
            const before=await page.locator('.planning-card').textContent();
            await page.locator('#display-zone').fill('Asia/Tokyo');
            await buffer.focus();await page.keyboard.press('ControlOrMeta+A');await page.keyboard.type('1e');
            await page.locator('[data-edit]').first().click();await page.locator('#source-form button[type="submit"]').click();
            assert.equal(await buffer.inputValue(),'1e');
            assert.equal(await page.locator('#display-zone').inputValue(),'Asia/Tokyo');
            assert.equal(await page.locator('.planning-card').textContent(),before);
            await page.locator('#settings-form button').click();
            assert.match(await page.locator('#settings-error').textContent(),/whole-number/);
            assert.equal(await buffer.evaluate(e=>e===document.activeElement),true);
            assert.equal(await buffer.inputValue(),'1e');
            await buffer.fill('120');await page.locator('#settings-form button').click();
            assert.equal(await page.locator('#settings-draft-status').textContent(),'');
            assert.notEqual(await page.locator('.planning-card').textContent(),before);
            await page.reload();assert.equal(await buffer.inputValue(),'120');assert.equal(await page.locator('#display-zone').inputValue(),'Asia/Tokyo');
            assert.equal(await page.locator('#export-calendar').isDisabled(),true);
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);assert.deepEqual(errors,[]);
            console.log('PASS: all8 public asset hashes;390px clarification access, required note, original quote preservation, reload and clearing; keyboard partial buffer retained through source save, invalid Apply safe/focused, explicit valid Apply and reload, export lock, nooverflow/errors');
          }finally{await browser.close();}
          JS
