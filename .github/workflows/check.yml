name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutoff-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record tested source identity
        shell: bash
        run: |
          git rev-parse HEAD
          git ls-files -z | xargs -0 sha256sum
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Select the installed Chromium for the unchanged test harness
        shell: bash
        run: node --input-type=module -e "import { chromium } from 'playwright'; console.log('CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run model, build and browser checks
        run: npm run check
      - name: Retain newly generated synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cutoff-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: false
          path: |
            evidence/desktop-conflict.png
            evidence/desktop-fold-resolved.png
            evidence/mobile-agreement.png
            evidence/mobile-source-dialog.png
            evidence/mobile-320.png
            evidence/axe-desktop.json
            evidence/axe-modal.json
            evidence/axe-mobile.json
            evidence/ui-results.json
            evidence/ui-failure.txt
            evidence/export-example.ics
