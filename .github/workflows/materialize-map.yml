name: Materialize reviewed Cutoff source map
on:
  push:
    branches: [delivery/materialize-cutoff-map-20261101]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: eec7c6dbf51cd12a1562c1a23b347bdfc62a19c9
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Verify and materialize exact reviewed source map only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          data = Path('dist/app.js.map').read_bytes()
          expected = 'ff5bfc4af806640931dbc6f3010cf7453954663d'
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert actual == expected, (actual, expected)
          url = 'https://api.github.com/repos/sharonbasovich/cutoff/git/blobs'
          body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request(url, body, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.load(response)
          assert result['sha'] == expected
          print('Verified and materialized source-map blob:', result['sha'])
          PY
